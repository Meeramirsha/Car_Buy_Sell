<div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card border-0 shadow-lg animate__animated animate__fadeIn">
          <div class="card-body p-5">
            <div class="text-center mb-5">
              <h2 class="fw-bold text-primary">Sign In</h2>
              <p class="text-muted small">Access your SmartCar account</p>
            </div>
            <div *ngIf="error" class="alert alert-danger border-0 small py-2 px-3 mb-4 animate__animated animate__shakeX">
              <i class="bi bi-exclamation-circle me-2"></i> {{ error }}
            </div>
  
            <form (ngSubmit)="onLogin()">
              <div class="mb-4">
                <label class="form-label small fw-bold text-muted">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-0"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control bg-light border-0" [(ngModel)]="credentials.email" name="email" placeholder="name@example.com" required autocomplete="username">
                </div>
              </div>
  
              <div class="mb-5">
                <div class="d-flex justify-content-between">
                  <label class="form-label small fw-bold text-muted">Password</label>
                  <a routerLink="/forgot-password" class="small text-decoration-none">Forgot?</a>
                </div>
                <div class="input-group">
                  <span class="input-group-text bg-light border-0"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control bg-light border-0" [(ngModel)]="credentials.password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
              </div>
  
              <button type="submit" class="btn btn-primary w-100 btn-lg shadow-sm mb-4">Login to Account</button>
  
              <div class="text-center">
                <span class="text-muted small">New to SmartCar?</span>
                <a routerLink="/register" class="small fw-bold text-primary text-decoration-none ms-1">Create an Account</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
