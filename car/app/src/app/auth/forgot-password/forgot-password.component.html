<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card border-0 shadow-lg animate__animated animate__fadeIn">
        <div class="card-body p-5">
          <div class="text-center mb-5">
            <h2 class="fw-bold text-primary">Reset Password</h2>
            <p class="text-muted small">Enter your email and we'll send you a link to restore access</p>
          </div>

          <div *ngIf="error" class="alert alert-danger border-0 small py-2 px-3 mb-4 animate__animated animate__shakeX">
            <i class="bi bi-exclamation-circle me-2"></i> {{ error }}
          </div>

          <div *ngIf="message" class="alert alert-success border-0 small py-2 px-3 mb-4 animate__animated animate__fadeIn">
            <i class="bi bi-check-circle me-2"></i> {{ message }}
          </div>

          <form (ngSubmit)="onSubmit()" *ngIf="!message">
            <div class="mb-4">
              <label class="form-label small fw-bold text-muted">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-0"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control bg-light border-0" [(ngModel)]="email" name="email" 
                  placeholder="name@example.com" required autocomplete="email">
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-lg shadow-sm mb-4" [disabled]="loading">
              <span *ngIf="!loading">Send Reset Link</span>
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
              <span *ngIf="loading">Processing...</span>
            </button>

            <div class="text-center">
              <a routerLink="/login" class="small fw-bold text-primary text-decoration-none">Back to Login</a>
            </div>
          </form>

          <div class="text-center mt-4" *ngIf="message">
             <button routerLink="/login" class="btn btn-outline-primary shadow-sm px-4">Return to Login</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
