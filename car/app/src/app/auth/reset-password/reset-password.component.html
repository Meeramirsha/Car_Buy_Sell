<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card border-0 shadow-lg animate__animated animate__fadeIn">
        <div class="card-body p-5">
          <div class="text-center mb-5">
            <h2 class="fw-bold text-primary">Set New Password</h2>
            <p class="text-muted small">Choose a strong password to protect your account</p>
          </div>

          <div *ngIf="error" class="alert alert-danger border-0 small py-2 px-3 mb-4 animate__animated animate__shakeX">
            <i class="bi bi-exclamation-circle me-2"></i> {{ error }}
          </div>

          <div *ngIf="message" class="alert alert-success border-0 small py-2 px-3 mb-4 animate__animated animate__fadeIn">
            <i class="bi bi-check-circle me-2"></i> {{ message }}
          </div>

          <form (ngSubmit)="onSubmit()" *ngIf="!message && token">
            <div class="mb-4">
              <label class="form-label small fw-bold text-muted">New Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-0"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control bg-light border-0" [(ngModel)]="newPassword" 
                  name="newPassword" placeholder="••••••••" required autocomplete="new-password">
              </div>
            </div>

            <div class="mb-5">
              <label class="form-label small fw-bold text-muted">Confirm New Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-0"><i class="bi bi-lock-fill"></i></span>
                <input type="password" class="form-control bg-light border-0" [(ngModel)]="confirmPassword" 
                  name="confirmPassword" placeholder="••••••••" required autocomplete="new-password">
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-lg shadow-sm mb-4" [disabled]="loading">
              <span *ngIf="!loading">Update Password</span>
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
              <span *ngIf="loading">Updating...</span>
            </button>
          </form>

          <div class="text-center" *ngIf="!token">
             <button routerLink="/forgot-password" class="btn btn-primary shadow-sm px-4">Request New Link</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
