<div class="bg-light-soft min-vh-100 py-5">
  <div class="container">
    <div class="text-center mb-5">
      <h2 class="display-5 fw-bold text-dark">Find Your Next <span class="text-primary">Perfect Car</span></h2>
      <p class="lead text-muted">Browse through our curated collection of certified premium vehicles.</p>
    </div>

    <!-- Filter Section -->
    <div class="row g-4">
      <div class="col-lg-3">
        <div class="card border-0 shadow-sm rounded-4 p-4 sticky-top" style="top: 100px;">
          <h5 class="fw-bold mb-4">Filters</h5>

          <!-- Price Range Filter -->
          <div class="mb-4">
            <label class="form-label small fw-bold text-muted text-uppercase">Price Range</label>
            <select class="form-select border-0 bg-light-soft" [(ngModel)]="selectedPriceRange">
              <option>Any</option>
              <option>Under ₹5,00,000</option>
              <option>₹5,00,000 - ₹10,00,000</option>
              <option>₹10,00,000 - ₹20,00,000</option>
              <option>₹20,00,000+</option>
            </select>
          </div>

          <!-- Manufacturer Filter -->
          <div class="mb-4">
            <label class="form-label small fw-bold text-muted text-uppercase">Manufacturer</label>
            <select class="form-select border-0 bg-light-soft" [(ngModel)]="selectedMake">
              <option>Any</option>
              <option>Hyundai</option>
              <option>Maruti Suzuki</option>
              <option>Kia</option>
              <option>Honda</option>
              <option>Tata</option>
              <option>Mahindra</option>
              <option>BMW</option>
            </select>
          </div>

          <!-- Apply Filters Button -->
          <button class="btn btn-primary w-100 py-2 shadow-sm" (click)="applyFilters()">
            <i class="bi bi-filter me-2"></i>Apply Filters
          </button>
        </div>
      </div>

      <!-- Car Listing -->
      <div class="col-lg-9">
        <div class="row g-4" *ngIf="filteredCars.length > 0; else noResults">
          <div class="col-md-6 col-lg-4" *ngFor="let car of filteredCars">
            <div class="car-card h-100 bg-white shadow-sm border-0 position-relative">
              <!-- Comparison & Wishlist Icons -->
              <div class="position-absolute top-0 w-100 d-flex justify-content-between p-3 z-index-10">
                <div class="form-check">
                    <input class="form-check-input bg-white border-primary" type="checkbox" [checked]="checkSelected(car.id)" (change)="handleToggle(car)">
                </div>
                <button (click)="toggleWishlist(car); $event.stopPropagation()" class="btn btn-link p-0 text-decoration-none">
                  <i class="bi" [ngClass]="isWishlisted(car.id) ? 'bi-heart-fill text-danger' : 'bi-heart text-white'" style="text-shadow: 0 0 5px rgba(0,0,0,0.5);"></i>
                </button>
              </div>
              <div class="position-relative overflow-hidden">
                <img [src]="car.image || 'https://images.unsplash.com/photo-1549317661-bd32c8ce0db2'" class="img-fluid w-100 car-img-top" [alt]="car.make">
                <span class="badge bg-primary position-absolute top-0 start-0 m-3">{{ car.year }}</span>
              </div>
              <div class="card-body p-4">
                <h5 class="fw-bold mb-1">{{ car.make }} {{ car.model }}</h5>
                <p class="text-muted small mb-3">{{ car.fuelType }} • {{ car.mileage }} km</p>
                <div class="h5 mb-4 fw-bold text-primary">₹{{ car.price }}</div>
                <button class="btn btn-outline-primary w-100 py-2" (click)="openDetails(car)">Take Test Drive</button>
              </div>
            </div>
          </div>
        </div>
        
        <ng-template #noResults>
          <div class="card border-0 shadow-sm rounded-4 p-5 text-center">
            <i class="bi bi-search display-1 text-muted opacity-25 mb-4"></i>
            <h4 class="fw-bold">No cars matched your search</h4>
            <p class="text-muted">Try adjusting your filters to find more options.</p>
            <button class="btn btn-link" (click)="selectedPriceRange='Any'; selectedMake='Any'; applyFilters()">Clear all filters</button>
          </div>
        </ng-template>
      </div>
    </div>
  </div>
</div>

<!-- Floating Compare Button -->
<div class="position-fixed bottom-0 start-0 m-4 shadow-lg text-white" *ngIf="comparisonCount > 0" style="z-index: 1050;">
    <button (click)="startCompare()" class="btn btn-dark rounded-pill shadow-lg px-4 py-3 border-primary border-2 fw-bold">
        <i class="bi bi-arrow-left-right me-2"></i> Compare ({{ comparisonCount }}/2)
    </button>
</div>
