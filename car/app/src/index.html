<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Car Buy & Sell Platform</title>
  <base href="./"><!-- Changed to relative path for better compatibility -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Fonts for Neon Theme -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <!-- Basel Neon Theme CSS is imported in styles.css -->
</head>
<body>
  <app-root></app-root>
  
  <!-- Bootstrap JS - Placed at the end of the document for faster page loading -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Custom script for handling scrolling -->
  <script>
    // Global function to scroll to any element by ID
    window.scrollToElement = function(elementId) {
      console.log('Global scroll function called for: ' + elementId);
      
      // Wait for DOM to be fully loaded
      setTimeout(function() {
        try {
          // Try to find the element
          var element = document.getElementById(elementId);
          
          if (element) {
            console.log('Element found, scrolling to it');
            
            // Get position
            var rect = element.getBoundingClientRect();
            var scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            var targetPosition = rect.top + scrollTop - 100; // 100px offset for header
            
            // Scroll to element
            window.scrollTo({
              top: targetPosition,
              behavior: 'smooth'
            });
          } else {
            console.log('Element not found by ID, trying class selector');
            
            // Try class selector as fallback
            if (elementId === 'reviews') {
              var reviewsSection = document.querySelector('.testimonials-bg');
              if (reviewsSection) {
                console.log('Found by class, scrolling');
                reviewsSection.scrollIntoView({behavior: 'smooth', block: 'start'});
              } else {
                // Last resort
                console.log('Using fixed position fallback');
                window.scrollTo({top: 1500, behavior: 'smooth'});
              }
            }
          }
        } catch (error) {
          console.error('Error in scroll function:', error);
          // Ultimate fallback
          window.scrollTo({top: 1500, behavior: 'smooth'});
        }
      }, 100);
    };
    
    // Add click handlers after DOM is loaded
    document.addEventListener('DOMContentLoaded', function() {
      // Find all elements with data-scroll-to attribute
      setInterval(function() {
        var scrollButtons = document.querySelectorAll('[data-scroll-to]');
        
        scrollButtons.forEach(function(button) {
          if (!button.hasAttribute('data-scroll-handler-added')) {
            var targetId = button.getAttribute('data-scroll-to');
            
            button.addEventListener('click', function(e) {
              e.preventDefault();
              e.stopPropagation();
              console.log('Button clicked, scrolling to: ' + targetId);
              window.scrollToElement(targetId);
              return false;
            });
            
            // Mark as processed
            button.setAttribute('data-scroll-handler-added', 'true');
            console.log('Added handler to button for: ' + targetId);
          }
        });
      }, 1000); // Check every second for new buttons
    });
  </script>
</body>
</html>
